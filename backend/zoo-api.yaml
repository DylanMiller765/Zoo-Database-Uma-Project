          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Cancel Event Registration
      tags: [Event Registrations]
      description: Cancels (deletes) an event registration. Requires 'coordinator' role.
      security:
        - bearerAuth: [] # Role: coordinator
      responses:
        '204':
          description: Registration cancelled successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /event-registrations/event/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the event to retrieve attendees for.
    get:
      summary: Get Attendees for Event
      tags: [Event Registrations]
      description: Retrieves all registrations (attendees) for a specific event. Requires 'coordinator' role.
      security:
        - bearerAuth: [] # Role: coordinator
      responses:
        '200':
          description: A list of attendees for the specified event.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventRegistration'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

