openapi: 3.0.0
info:
  title: Zoo Management System API
  version: 1.0.0
  description: API for managing zoo operations, animals, staff, customers, sales, and events. Handles authentication and role-based permissions.
servers:
  - url: http://localhost:5000/api
    description: Development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained via `/auth/login`
  schemas:
    # --- Auth Schemas ---
    LoginCredentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address.
        password:
          type: string
          description: User's password (plain text).
    RegisterData:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip_code:
          type: string
          nullable: true
    UserAuthInfo:
      type: object
      properties:
        account_id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          description: Type of account.
          enum: [employee, customer]
        first_name:
          type: string
        last_name:
          type: string
        job_role:
          type: string
          description: Specific job role if the user is an employee.
          nullable: true
          enum: [keeper, manager, coordinator, cashier, guide, veterinarian, maintenance, security, other]
    AuthResponseData:
      type: object
      properties:
        token:
          type: string
          description: JWT token for authenticated requests.
        user:
          $ref: '#/components/schemas/UserAuthInfo'
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/AuthResponseData'
    UserProfile: # Based on auth.service.ts getProfile response
      type: object
      properties:
        account_id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [employee, customer]
        employee_id:
          type: integer
          nullable: true
        customer_id:
          type: integer
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        employee_first_name:
          type: string
          nullable: true
        employee_last_name:
          type: string
          nullable: true
        employee_email:
          type: string
          nullable: true
        employee_phone:
          type: string
          nullable: true
        job_role:
          type: string
          nullable: true
          enum: [keeper, manager, coordinator, cashier, guide, veterinarian, maintenance, security, other]
        department:
          type: string
          nullable: true
        customer_first_name:
          type: string
          nullable: true
        customer_last_name:
          type: string
          nullable: true
        customer_email:
          type: string
          nullable: true
        customer_phone:
          type: string
          nullable: true
        annual_pass:
          type: string
          enum: [yes, no]
          nullable: true

    # --- Animal Schemas ---
    AnimalData: # For POST/PUT requests
      type: object
      required:
        - name
        - species
        - arrival_date
        - date_of_birth # Required by frontend form
      properties:
        name:
          type: string
        scientific_name:
          type: string
          nullable: true
        species:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
        arrival_date:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, unknown]
          nullable: true
        place_of_origin:
          type: string
          nullable: true
        habitat_id:
          type: integer
          nullable: true
        medical_notes:
          type: string
          nullable: true
        health_status:
          type: string
          enum: [excellent, good, fair, poor, critical]
          nullable: true
        active_status:
          type: string
          enum: [active, transferred, deceased]
          nullable: true
        endangerment_status:
          type: string
          enum: [least_concern, near_threatened, vulnerable, endangered, critically_endangered, extinct_in_the_wild, extinct]
          nullable: true
        weight:
          type: number
          format: float
          nullable: true
    Animal: # For GET responses
      allOf:
        - $ref: '#/components/schemas/AnimalData'
        - type: object
          properties:
            animal_id:
              type: integer
            created_date:
              type: string
              format: date-time
              nullable: true
            updated_date:
              type: string
              format: date-time
              nullable: true

    # --- Attraction Schemas ---
    AttractionData:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        location:
          type: string
        human_capacity:
          type: integer
        opening_time:
          type: string
          format: time
        closing_time:
          type: string
          format: time
        status:
          type: string
          enum: [open, closed, maintenance]
    Attraction:
      allOf:
        - $ref: '#/components/schemas/AttractionData'
        - type: object
          properties:
            attraction_id:
              type: integer

    # --- Cafe Schemas ---
    CafeData:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        location:
          type: string
          nullable: true
        opening_time:
          type: string
          format: time
          nullable: true
        closing_time:
          type: string
          format: time
          nullable: true
        manager_id:
          type: integer
          nullable: true
    Cafe:
      allOf:
        - $ref: '#/components/schemas/CafeData'
        - type: object
          properties:
            cafe_id:
              type: integer

    # --- CafeItem Schemas ---
    CafeItemData:
      type: object
      required:
        - cafe_id
        - name
        - price
      properties:
        cafe_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        price:
          type: number
          format: float
        is_available:
          type: boolean
          default: true
    CafeItem:
      allOf:
        - $ref: '#/components/schemas/CafeItemData'
        - type: object
          properties:
            item_id:
              type: integer

    # --- CafeSale Schemas ---
    CafeSaleItemData:
      type: object
      required:
        - item_id
        - quantity
        - line_total
      properties:
        item_id:
          type: integer
        quantity:
          type: integer
        line_total:
          type: number
          format: float
    CafeSaleData:
      type: object
      required:
        - cafe_id
        - employee_id
        - items
      properties:
        cafe_id:
          type: integer
        customer_id:
          type: integer
          nullable: true
        employee_id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CafeSaleItemData'
    CafeSale:
      allOf:
        - $ref: '#/components/schemas/CafeSaleData'
        - type: object
          properties:
            transaction_id:
              type: string
              format: uuid
            sale_timestamp:
              type: string
              format: date-time

    # --- Customer Schemas ---
    CustomerData: # Based on frontend form
      type: object
      required:
        - first_name
        - last_name
        - registration_date
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip_code:
          type: string
          nullable: true
        annual_pass:
          type: string
          enum: [yes, no]
          default: "no"
          nullable: true
        registration_date:
          type: string
          format: date
          nullable: true
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerData'
        - type: object
          properties:
            customer_id:
              type: integer

    # --- Dashboard Schemas ---
    DashboardStats:
      type: object
      properties:
        totalAnimals:
          type: integer
        totalEmployees:
          type: integer
        upcomingEvents:
          type: integer
        activeHabitats:
          type: integer
        todaysVisitors:
          type: integer
        monthlyRevenue:
          type: number
          format: float

    # --- Employee Schemas ---
    EmployeeData: # Based on frontend form
      type: object
      required:
        - first_name
        - last_name
        - ssn
        - job_role
        - employment_type
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        ssn:
          type: string
          pattern: '^\d{3}-?\d{2}-?\d{4}$'
        job_role:
          type: string
          enum: [keeper, manager, coordinator, cashier, guide, veterinarian, maintenance, security, other]
        employment_type:
          type: string
          enum: [full_time, part_time]
        salary:
          type: number
          format: float
          description: Required if employment_type is 'full_time'. Null if 'part_time'.
          nullable: true
        status:
          type: string
          enum: [active, inactive]
          default: active
          nullable: true
        hire_date:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip_code:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, other, prefer_not_to_say]
          nullable: true
        birthday:
          type: string
          format: date
          nullable: true
    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeData'
        - type: object
          properties:
            employee_id:
              type: integer

    # --- Event Schemas ---
    EventData: # For POST/PUT request body, based on frontend form
      type: object
      required:
        - event_name
        - event_date
        - start_time
        - end_time
      properties:
        event_name:
          type: string
        description:
          type: string
          nullable: true
        event_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          example: "14:00"
        end_time:
          type: string
          format: time
          example: "15:00"
        location:
          type: string
          nullable: true
        max_capacity:
          type: integer
          nullable: true
        created_by: # Mapped to coordinator_id in backend service
          type: integer
          nullable: true
    Event: # For GET response body
      type: object
      properties:
        event_id:
          type: integer
        event_name:
          type: string
        description:
          type: string
          nullable: true
        event_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        location:
          type: string
          nullable: true
        max_capacity:
          type: integer
          nullable: true
        status: # Added by backend service
          type: string
          enum: [scheduled, ongoing, completed, cancelled]
          default: scheduled
        created_by: # coordinator_id from DB
          type: integer
          nullable: true

    # --- EventRegistration Schemas ---
    EventRegistrationData:
      type: object
      required:
        - event_id
        - number_of_participants
      properties:
        event_id:
          type: integer
        customer_id:
          type: integer
          nullable: true
        number_of_participants:
          type: integer
          default: 1
        total_amount:
          type: number
          format: float
          nullable: true
        payment_status:
          type: string
          enum: [pending, paid, cancelled]
          default: pending
    EventRegistration:
      allOf:
        - $ref: '#/components/schemas/EventRegistrationData'
        - type: object
          properties:
            registration_id:
              type: integer
            registration_date:
              type: string
              format: date-time

    # --- GiftShop Schemas ---
    GiftShopData: # Based on frontend form
      type: object
      required:
        - name
      properties:
        name:
          type: string
        location:
          type: string
          nullable: true
        opening_time:
          type: string
          format: time
          nullable: true
        closing_time:
          type: string
          format: time
          nullable: true
        manager_id:
          type: integer
          nullable: true
    GiftShop:
      allOf:
        - $ref: '#/components/schemas/GiftShopData'
        - type: object
          properties:
            gift_shop_id:
              type: integer

    # --- GiftShopItem Schemas ---
    GiftShopItemData:
      type: object
      required:
        - gift_shop_id
        - name
        - price
        - quantity_in_stock
      properties:
        gift_shop_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        price:
          type: number
          format: float
        cost:
          type: number
          format: float
          nullable: true
        quantity_in_stock:
          type: integer
        supplier:
          type: string
          nullable: true
    GiftShopItem:
      allOf:
        - $ref: '#/components/schemas/GiftShopItemData'
        - type: object
          properties:
            item_id:
              type: integer

    # --- GiftShopSale Schemas ---
    GiftShopSaleItemData:
      type: object
      required:
        - item_id
        - quantity
        - unit_price
      properties:
        item_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
          format: float
    GiftShopSaleData: # For POST requests
      type: object
      required:
        - gift_shop_id
        - employee_id
        - payment_method
        - items
      properties:
        gift_shop_id:
          type: integer
        customer_id:
          type: integer
          nullable: true
        employee_id:
          type: integer
        payment_method:
          type: string
          enum: [cash, credit, debit]
        items:
          type: array
          items:
            $ref: '#/components/schemas/GiftShopSaleItemData'
    GiftShopSale: # For GET responses
      type: object
      properties:
        transaction_id:
          type: integer
        gift_shop_id:
          type: integer
        customer_id:
          type: integer
          nullable: true
        employee_id:
          type: integer
        sale_date:
          type: string
          format: date-time
        total_amount:
          type: number
          format: float
        payment_method:
          type: string
          enum: [cash, credit, debit]
        items:
          type: array
          items:
            $ref: '#/components/schemas/GiftShopSaleItemData'

    # --- Habitat Schemas ---
    HabitatData:
      type: object
      required:
        - habitat_name
      properties:
        habitat_name:
          type: string
        attraction_id:
          type: integer
          nullable: true
        size:
          type: string
          nullable: true
        environment_type:
          type: string
          nullable: true
        animal_capacity:
          type: integer
          default: 10
        cleaning_schedule:
          type: string
          nullable: true
        last_maintenance:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [active, maintenance, renovation, closed]
          default: active
          nullable: true
    Habitat:
      allOf:
        - $ref: '#/components/schemas/HabitatData'
        - type: object
          properties:
            habitat_id:
              type: integer
            created_date:
              type: string
              format: date-time
              nullable: true

    # --- Ticket Schemas ---
    TicketData: # For POST requests
      type: object
      required:
        - visit_date
        - ticket_type
        - price
      properties:
        customer_id:
          type: integer
          nullable: true
        visit_date:
          type: string
          format: date
        ticket_type:
          type: string
          enum: [adult, child, senior, student]
        price:
          type: number
          format: float
        payment_method:
          type: string
          enum: [cash, credit, debit, online]
          nullable: true
    Ticket: # For GET responses
      allOf:
        - $ref: '#/components/schemas/TicketData'
        - type: object
          properties:
            ticket_id:
              type: integer
            purchase_date:
              type: string
              format: date-time

    # --- Error Schema ---
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors: # Optional: For validation errors
          type: array
          items:
            type: object

  # --- Reusable Responses ---
  responses:
    UnauthorizedError:
      description: Unauthorized - Invalid or missing JWT token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Forbidden - User does not have the required role/permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid input data provided in the request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /health:
    get:
      summary: Health Check
      tags: [Public]
      description: Checks if the API server is operational.
      security: [] # No authentication required
      responses:
        '200':
          description: API is running successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  # --- Auth ---
  /auth/register:
    post:
      summary: Register Customer
      tags: [Auth]
      description: Creates a new customer account.
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterData'
      responses:
        '201':
          description: Registration successful, returns JWT and user info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error (e.g., missing fields, invalid email).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error during registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Login User (Employee or Customer)
      tags: [Auth]
      description: Authenticates a user and returns a JWT token.
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
      responses:
        '200':
          description: Login successful, returns JWT and user info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error or missing credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials (wrong email or password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/profile:
    get:
      summary: Get Authenticated User Profile
      tags: [Auth]
      description: Retrieves profile information for the currently logged-in user. Requires JWT authentication.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile data retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized (invalid or missing token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found based on token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout User
      tags: [Auth]
      description: Logs out the user (currently just returns a success message, no server-side session invalidation).
      security: [] # Note: Ideally requires authentication to logout a specific session, but current implementation is public.
      responses:
        '200':
          description: Logout successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          description: Server error during logout attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Dashboard ---
  /dashboard/stats:
    get:
      summary: Get Dashboard Statistics
      tags: [Dashboard]
      description: Retrieves key statistics for the admin dashboard. Requires JWT authentication.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard statistics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error fetching stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Events ---
  /events:
    get:
      summary: Get Upcoming Events
      tags: [Events]
      description: Retrieves a list of events scheduled for today or in the future. Public access.
      security: [] # Public
      responses:
        '200':
          description: A list of upcoming events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '500':
          description: Server error fetching events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Event
      tags: [Events]
      description: Creates a new event. Requires 'coordinator' or 'manager' role.
      security:
        - bearerAuth: [] # Roles: coordinator, manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventData'
      responses:
        '201':
          description: Event created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Validation error in request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error creating event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the event to operate on.
    get:
      summary: Get Event by ID
      tags: [Events]
      description: Retrieves details for a specific event by its ID. Public access.
      security: [] # Public
      responses:
        '200':
          description: Event details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
